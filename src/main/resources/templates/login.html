<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS | Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        
        .login-card { 
            background: #1e293b; 
            border-radius: 20px; 
            padding: 40px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
        }

        .brand-title { color: #ffffff; font-weight: 800; font-size: 2rem; }
        .brand-accent { color: #38bdf8; }
        .phrase-claire { color: #cbd5e1 !important; font-size: 1rem; margin-bottom: 25px; }

        /* STYLE DE L'ALERTE ERREUR */
        .alert-error {
            background-color: rgba(239, 68, 68, 0.2) !important;
            color: #f87171 !important;
            border: 1px solid #ef4444 !important;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .form-label { color: #38bdf8; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; text-align: left; display: block; }
        
        .form-control { 
            background: #0f172a !important; 
            border: 1px solid #334155 !important; 
            color: #ffffff !important; 
            padding: 12px; 
        }

        .btn-login { background: #38bdf8; color: #0f172a; font-weight: 800; border: none; width: 100%; padding: 12px; margin-top: 10px; }
        .btn-login:hover { background: #0ea5e9; color: white; }

        .footer-text { color: #94a3b8 !important; font-size: 0.9rem; margin-top: 20px; }
        .link-signup { color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="brand-title mb-1">LIAS <span class="brand-accent">LAB</span></h2>
        <p class="phrase-claire">Espace Direction</p>
        
        <!-- ========================================== -->
        <!-- AFFICHAGE DU MESSAGE D'ERREUR ICI -->
        <!-- ========================================== -->
        <div th:if="${erreur}" class="alert-error">
            ⚠️ <span th:text="${erreur}">Message d'erreur</span>
        </div>
        <!-- ========================================== -->

        <!-- Message de succès après inscription -->
        <div th:if="${param.success}" class="alert alert-success p-2 small" style="background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: #22c55e; margin-bottom: 20px;">
            ✅ Demande envoyée avec succès !
        </div>

        <form th:action="@{/connexion}" method="post">
            <div class="mb-3 text-start">
                <label class="form-label">EMAIL PROFESSIONNEL</label>
                <input type="email" name="email" class="form-control" required placeholder="nom@univmsik.ma">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label">MOT DE PASSE</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-login shadow">SE CONNECTER</button>
        </form>
        
        <hr style="border-color: #334155; margin: 25px 0;">
        <p class="footer-text">
            Accès public ? <br>
            <a href="/" class="link-signup">Retour à l'accueil</a>
        </p>
    </div>
</body>
</html>
