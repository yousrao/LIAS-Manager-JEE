<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS | Gérer Matériel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; padding-top: 50px; font-family: 'Segoe UI', sans-serif; }
        .card-form { background-color: #1e293b; border: 1px solid #334155; border-radius: 15px; }
        .form-label { color: #38bdf8 !important; font-weight: bold; margin-top: 10px; }
        .form-control, .form-select { background-color: #0f172a !important; border: 1px solid #334155 !important; color: #ffffff !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card card-form shadow-lg mx-auto p-4" style="max-width: 650px;">
            <h2 class="text-white text-center mb-4 border-bottom pb-3">🛠️ Gestion de l'Équipement</h2>
            
            <form th:action="@{/sauvegarder-materiel}" th:object="${materiel}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label class="form-label">Désignation du Matériel</label>
                    <input type="text" th:field="*{nom}" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Marque / Modèle</label>
                        <input type="text" th:field="*{marque}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Numéro d'inventaire</label>
                        <input type="text" th:field="*{numeroInventaire}" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Affecter à un chercheur (Distribution)</label>
                    <select th:field="*{detenteur}" class="form-select">
                        <option th:value="${null}">-- Garder en stock --</option>
                        <option th:each="u : ${membres}" th:value="${u.id}" th:text="${u.nom}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">État du matériel</label>
                    <select th:field="*{etat}" class="form-select">
                        <option value="NEUF">Neuf</option>
                        <option value="BON">Bon état</option>
                        <option value="USÉ">Usé</option>
                        <option value="EN PANNE">En panne</option>
                    </select>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-info fw-bold text-dark">VALIDER L'ARRIVAGE / DISTRIBUTION</button>
                    <a href="/materiel" class="btn btn-outline-secondary">Retour</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
