<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS | Modifier Publication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .sidebar { height: 100vh; background: #1e293b; padding: 25px; position: fixed; width: 260px; border-right: 1px solid #334155; }
        .main-content { margin-left: 260px; padding: 40px; }
        .nav-link { color: #94a3b8 !important; padding: 12px; text-decoration: none; display: block; border-radius: 8px; margin-bottom: 5px; }
        .nav-link:hover, .nav-link.active { background: #334155; color: #38bdf8 !important; }
        
        .card-form { background-color: #1e293b; border: 1px solid #334155; border-radius: 15px; padding: 30px; }
        .form-label { color: #38bdf8 !important; font-weight: bold; }
        .form-control, .form-select { background-color: #0f172a !important; border: 1px solid #334155 !important; color: #ffffff !important; }
        .btn-update { background-color: #fbbf24; color: #0f172a; font-weight: bold; border: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3 class="text-white fw-bold mb-5 text-center">LIAS LAB</h3>
        <nav class="nav flex-column">
            <a class="nav-link" href="/">👥 Équipe</a>
            <a class="nav-link active" href="/publications">📚 Publications</a>
            <a class="nav-link" href="/evenements">📅 Événements</a>
            <a class="nav-link" href="/materiel">🛠️ Matériel</a>
            <a class="nav-link" href="/reunions">📝 Réunions & PV</a>
            <a class="nav-link" href="/rapport">📊 Rapport Annuel</a>
        </nav>
    </div>

    <div class="main-content">
        <h1 class="text-white fw-bold mb-4">MODIFIER LA PUBLICATION</h1>
        
        <div class="card-form shadow-lg">
            <form th:action="@{/sauvegarder-pub}" th:object="${pub}" method="post">
                <!-- ID CACHÉ INDISPENSABLE -->
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label class="form-label">Titre de l'article</label>
                    <input type="text" th:field="*{titre}" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Année</label>
                        <input type="number" th:field="*{annee}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Type</label>
                        <select th:field="*{type}" class="form-select">
                            <option value="ARTICLE">Article Scientifique</option>
                            <option value="CONFERENCE">Communication Conférence</option>
                            <option value="LIVRE">Livre / Chapitre</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Auteur</label>
                    <select th:field="*{auteur}" class="form-select">
                        <option th:each="m : ${membres}" th:value="${m.id}" th:text="${m.nom}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lien (URL)</label>
                    <input type="text" th:field="*{lien}" class="form-control">
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-update py-2">METTRE À JOUR LA PUBLICATION</button>
                    <a href="/publications" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
