<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS | Adhésion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* FOND SOMBRE */
        body { background-color: #0f172a; padding: 50px 0; font-family: 'Segoe UI', sans-serif; }
        
        .signup-card { 
            background: #1e293b; 
            border-radius: 20px; 
            padding: 40px; 
            max-width: 550px; 
            margin: auto; 
            border: 1px solid #334155; 
            color: white; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* LE TITRE */
        .titre-principal { color: #ffffff; font-weight: 800; }

        /* CORRECTION : LA PHRASE DE DESCRIPTION EN CLAIR */
        .description-claire { 
            color: #cbd5e1 !important; /* Gris très clair/Bleu givré */
            font-size: 1rem; 
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* TITRES DES CHAMPS (LABELS) */
        .form-label { color: #38bdf8; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; margin-top: 10px; }

        /* STYLE DES CASES DE SAISIE */
        .form-control, .form-select { 
            background: #0f172a !important; 
            border: 1px solid #334155 !important; 
            color: #ffffff !important; /* Texte tapé en blanc pur */
            padding: 12px;
        }
        
        .form-control::placeholder { color: #475569; }

        .btn-submit { background: #38bdf8; color: #0f172a; font-weight: 800; border: none; padding: 15px; }
        .btn-submit:hover { background: #0ea5e9; color: white; }
    </style>
</head>
<body>
    <div class="signup-card">
        <h3 class="text-center titre-principal mb-2">Demande d'Adhésion au LIAS</h3>
        
        <!-- ICI LA CORRECTION DE VISIBILITÉ -->
        <p class="text-center description-claire">
            Remplissez ce formulaire pour soumettre votre candidature au directeur du laboratoire. 
            Une réponse vous sera envoyée par email après étude de votre dossier.
        </p>
        
        <form th:action="@{/envoyer-demande}" th:object="${user}" method="post">
            <div class="mb-3">
                <label class="form-label">Nom et Prénom Complet</label>
                <input type="text" th:field="*{nom}" class="form-control" required placeholder="Ex: Nawal Sael">
            </div>

            <div class="mb-3">
                <label class="form-label">Email Universitaire</label>
                <input type="email" th:field="*{email}" class="form-control" required placeholder="nom@univ-ma">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Équipe Souhaitée</label>
                    <select th:field="*{equipe}" class="form-select">
                        <option value="ISDIAC">ISDIAC</option>
                        <option value="SIMA">SIMA</option>
                        <option value="SDTIC">SDTIC</option>
                        <option value="ILIAS">ILIAS</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Statut</label>
                    <select th:field="*{statut}" class="form-select">
                        <option value="DOCTORANT">Doctorant</option>
                        <option value="ASSOCIE">Chercheur Associé</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Thèmes de recherche / Motivation</label>
                <textarea th:field="*{themes}" class="form-control" rows="3" placeholder="Décrivez brièvement votre projet de recherche..."></textarea>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-submit">SOUMETTRE MA CANDIDATURE</button>
                <a href="/login" class="btn btn-outline-secondary text-white border-secondary">RETOUR AU LOGIN</a>
            </div>
        </form>
    </div>
</body>
</html>
