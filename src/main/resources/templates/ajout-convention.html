<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS | Gérer Convention</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; padding-top: 50px; font-family: 'Segoe UI', sans-serif; }
        .card-form { background-color: #1e293b; border: 1px solid #334155; border-radius: 15px; }
        .form-label { color: #38bdf8 !important; font-weight: bold; margin-top: 10px; }
        .form-control, .form-select { background-color: #0f172a !important; border: 1px solid #334155 !important; color: #ffffff !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card card-form shadow-lg mx-auto p-4" style="max-width: 650px;">
            <h2 class="text-white text-center mb-4 border-bottom pb-3">🤝 Gérer la Convention</h2>
            <form th:action="@{/sauvegarder-convention}" th:object="${convention}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label class="form-label">Nom du Partenaire</label>
                    <input type="text" th:field="*{partenaire}" class="form-control" placeholder="Ex: Université Hassan II" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Type</label>
                        <select th:field="*{type}" class="form-select">
                            <option value="NATIONALE">Nationale</option>
                            <option value="INTERNATIONALE">Internationale</option>
                            <option value="INDUSTRIELLE">Industrielle</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date de signature</label>
                        <input type="date" th:field="*{dateSignature}" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Objectif de la collaboration</label>
                    <textarea th:field="*{objectif}" class="form-control" rows="3"></textarea>
                </div>
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-info fw-bold text-dark">ENREGISTRER LA CONVENTION</button>
                    <a href="/conventions" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
