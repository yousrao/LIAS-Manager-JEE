<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS | Modifier Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Exactement le même style que ton inscription */
        body { background-color: #0f172a; color: white; padding-top: 50px; font-family: 'Segoe UI', sans-serif; }
        .card-form { background-color: #1e293b; border: 1px solid #334155; border-radius: 15px; }
        
        /* Titres des champs en bleu ciel */
        .form-label { color: #38bdf8 !important; font-weight: bold; margin-top: 10px; }
        
        /* Style des cases de saisie */
        .form-control, .form-select { 
            background-color: #0f172a !important; 
            border: 1px solid #334155 !important; 
            color: #ffffff !important; 
        }
        .form-control:focus { border-color: #38bdf8; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card card-form shadow-lg mx-auto p-4" style="max-width: 650px;">
            <!-- Titre adapté pour la modification -->
            <h2 class="text-white text-center mb-4 border-bottom pb-3">📝 Modifier les Informations</h2>
            
            <form th:action="@{/sauvegarder}" th:object="${user}" method="post">
                
                <!-- INDISPENSABLE : L'ID caché pour ne pas créer un nouveau membre -->
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label class="form-label">Nom & Prénom</label>
                    <input type="text" th:field="*{nom}" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email Universitaire</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Équipe</label>
                        <select th:field="*{equipe}" class="form-select">
                            <option value="ISDIAC">ISDIAC</option>
                            <option value="SIMA">SIMA</option>
                            <option value="SDTIC">SDTIC</option>
                            <option value="ILIAS">ILIAS</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Thèmes de recherche</label>
                    <input type="text" th:field="*{themes}" class="form-control">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Rôle (Gouvernance)</label>
                        <select th:field="*{role}" class="form-select">
                            <option value="MEMBRE">Membre Simple</option>
                            <option value="CHEF_EQUIPE">Chef d'équipe</option>
                            <option value="DIRECTEUR">Directeur du Labo</option>
                            <option value="DIRECTEUR_ADJOINT">Directeur Adjoint</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Statut Scientifique</label>
                        <select th:field="*{statut}" class="form-select">
                            <option value="PERMANENT">Enseignant Chercheur</option>
                            <option value="DOCTORANT">Doctorant</option>
                            <option value="ASSOCIE">Membre Associé</option>
                        </select>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <!-- Bouton Orange/Jaune pour différencier la modification de l'ajout -->
                    <button type="submit" class="btn btn-warning fw-bold text-dark">Mettre à jour le profil</button>
                    <!-- On change href="/" par href="/admin" -->
                    <a href="/admin" class="btn btn-outline-secondary">Annuler et Retour</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
