<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS | Gérer Événement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; padding-top: 50px; font-family: 'Segoe UI', sans-serif; }
        .card-form { background-color: #1e293b; border: 1px solid #334155; border-radius: 15px; }
        .form-label { color: #38bdf8 !important; font-weight: bold; margin-top: 10px; }
        .form-control, .form-select { background-color: #0f172a !important; border: 1px solid #334155 !important; color: #ffffff !important; }
        .form-control:focus { border-color: #38bdf8; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card card-form shadow-lg mx-auto p-4" style="max-width: 650px;">
            <h2 class="text-white text-center mb-4 border-bottom pb-3">📅 Gérer l'Événement</h2>
            
            <form th:action="@{/sauvegarder-event}" th:object="${event}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label class="form-label">Titre de l'activité</label>
                    <input type="text" th:field="*{titre}" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Type</label>
                        <select th:field="*{type}" class="form-select">
                            <option value="CONFERENCE">Conférence / Journée</option>
                            <option value="SEMINAIRE">Séminaire Doctoral</option>
                            <option value="WORKSHOP">Workshop / Atelier</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date prévue</label>
                        <input type="date" th:field="*{dateEvenement}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lieu de déroulement</label>
                    <input type="text" th:field="*{lieu}" class="form-control" placeholder="Ex: Amphi 8, Ben M'Sik">
                </div>

                <div class="mb-3">
                    <label class="form-label">Organisateur responsable</label>
                    <input type="text" th:field="*{organisateur}" class="form-control" placeholder="Ex: Pr. Benabbou">
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-info fw-bold text-dark">ENREGISTRER L'ÉVÉNEMENT</button>
                    <a href="/evenements" class="btn btn-outline-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
